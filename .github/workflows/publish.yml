name: PyPI’ga chiqarish

# GitHub’da yangi Release e’lon qilinganda (masalan, v2.0.0 tegi bilan)
# paket yig‘iladi, tekshiriladi va PyPI’ga Trusted Publishing orqali yuklanadi.
# Token kerak emas: pypi.org da "trusted publisher" sozlangan bo‘lishi kifoya.

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Testlar
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q
      - name: Teg va versiya mosligini tekshirish
        run: |
          VERSIYA=$(python -c "import LotinKrillYangiLotin as m; print(m.__version__)")
          TEG="${GITHUB_REF_NAME#v}"
          echo "Paket: $VERSIYA, teg: $TEG"
          if [ "$VERSIYA" != "$TEG" ]; then
            echo "::error::Teg (v$TEG) va paket versiyasi ($VERSIYA) mos emas"
            exit 1
          fi
      - name: Yig‘ish
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/LotinKrillYangiLotin/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
