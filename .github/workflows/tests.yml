name: Testlar

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: O‘rnatish
        run: python -m pip install -e ".[dev]"
      - name: pytest
        run: python -m pytest -v

  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: PyPI klassifikatorlarini tekshirish
        run: |
          python -m pip install trove-classifiers
          python - <<'PY'
          import sys, tomllib
          from trove_classifiers import classifiers
          meta = tomllib.load(open("pyproject.toml", "rb"))["project"]
          xato = [c for c in meta.get("classifiers", []) if c not in classifiers]
          if xato:
              sys.exit(f"PyPI qabul qilmaydigan klassifikatorlar: {xato}")
          print("Klassifikatorlar to‘g‘ri:", len(meta["classifiers"]))
          PY
      - name: Paketni yig‘ish va tekshirish
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
